<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Taskify</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <h1>Taskify</h1>

    <!-- Task Input -->
    <div class="task-input">
      <input type="text" id="taskInput" placeholder="Enter your task..." />
      <button id="addTaskBtn">Add Task</button>
    </div>

    <!-- Task Boards -->
    <div class="board-container">
      <div class="board" id="todo" ondrop="drop(event)" ondragover="allowDrop(event)">
        <h2>To Do</h2>
        <div class="task-list" id="todoList"></div>
      </div>

      <div class="board" id="inprogress" ondrop="drop(event)" ondragover="allowDrop(event)">
        <h2>In Progress</h2>
        <div class="task-list" id="inProgressList"></div>
      </div>

      <div class="board" id="done" ondrop="drop(event)" ondragover="allowDrop(event)">
        <h2>Done</h2>
        <div class="task-list" id="doneList"></div>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
