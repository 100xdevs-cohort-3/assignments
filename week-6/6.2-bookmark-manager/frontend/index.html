<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Bookmark manager</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main>
      <p>WEEK 06 / YOUR READING SHELF</p>
      <h1>Keep the good links.</h1>
      <p>Saved in server memory for this session.</p>
      <form id="add">
        <label>Category <input name="category" required maxlength="80" /></label
        ><label
          >Website URL
          <input name="url" type="url" required placeholder="https://example.com" /></label
        ><button>Add bookmark</button>
      </form>
      <label>Search <input id="search" type="search" /></label
      ><label><input id="favorites" type="checkbox" />Favorites only</label>
      <p id="message" role="status"></p>
      <div id="items"></div>
    </main>
    <script src="script.js"></script>
  </body>
</html>
