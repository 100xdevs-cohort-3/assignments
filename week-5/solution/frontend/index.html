<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Taskify Frontend</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">
        <!-- <h2>Taskify Frontend</h2> -->

        <div id="signup-container">
            <h2>Signup</h2>
            <form id="signup-form">
                <label for="signup-username">Username:</label>
                <input type="text" id="signup-username" required>
                <label for="signup-password">Password:</label>
                <input type="password" id="signup-password" required>
                <button type="submit">Signup</button>
                <!-- 
                    invokes document.getElementById('signup-form').addEventListener('submit') 
                    in script.js with signup-username and signup-password 
                -->
            </form>
            <p>
                Already have an account? <a href="#" id="show-signin">Sign In</a>
                <!-- 
                    invokes document.getElementById('show-signin').addEventListener('click')
                -->
            </p>
        </div>

        <div id="signin-container" style="display: none;">
            <h2>Signin</h2>
            <form id="signin-form">
                <label for="signin-username">Username:</label>
                <input type="text" id="signin-username" required>
                <label for="signin-password">Password:</label>
                <input type="password" id="signin-password" required>
                <button type="submit">Signin</button>
                <!-- 
                    invokes document.getElementById('signin-form').addEventListener('submit') 
                    in script.js with signin-username and signin-password 
                -->
            </form>
            <p>
                Don't have an account? <a href="#" id="show-signup">Sign Up</a>
                <!-- 
                    invokes document.getElementById('show-signup').addEventListener('click')
                -->
            </p>
        </div>

        <div id="todo-container" style="display: none;">
            <h2>Your Todo List</h2>
            <form id="todo-form">
                <input type="text" id="todo-input" placeholder="Add a new todo" required>
                <button type="submit">Add Todo</button>
            </form>
            <ul id="todo-list">
                <!-- todo-list will be appended here by loadTodos() in script.js -->
            </ul>
            <button id="logout-link">Logout</button>

        </div>

        <p id="response-message"></p>
    </div>

    <script src="script.js"></script>
</body>

</html>
