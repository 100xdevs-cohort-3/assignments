
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flex Layout</title>
    <link rel="stylesheet" href="./index.css">

    <style>
        .container {
            width: 1200px;
            margin: 50px auto;
            height: 200px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .left {
            display: flex;
            flex: 1;
            background-color: red;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .right {
            flex: 2;
            background-color: blue;
            display: flex;
            justify-content: center;
            align-items: center;
        }
    </style>
</head>

<body>
    <div class="container">
            <h1 class="left">Left</h1>
            <h1 class="right">Right</h1>
    </div>
</body>

</html>
