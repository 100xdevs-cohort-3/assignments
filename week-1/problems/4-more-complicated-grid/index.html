
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid Layout</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #f5f5f5;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            width: 100%;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 10px;
            min-height: 400px;
        }

        .left {
            background-color: red;
            padding: 30px;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
        }

        .left h1 {
            margin-bottom: 20px;
            text-align: center;
        }

        .left p {
            line-height: 1.8;
            margin-bottom: 15px;
        }

        .right {
            background-color: blue;
            padding: 30px;
        }

        .grid1 {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 15px;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="left">
            <div>
                <div class="horizontal-center">
                    <h1>Left</h1>
                </div>
                <div>
                    <h3>
                    text text text text text text text text text text text text text
                    </h3>
                </div>
            </div>
        </div>
        <div class="right">
            <div class="grid1">
                <h2>Col 1</h2>
                <h2>Col 2</h2>
                <h2>Col 3</h2>
                <h2>Col 1</h2>
                <h2>Col 2</h2>
                <h2>Col 3</h2>
                <h2>Col 1</h2>
                <h2>Col 2</h2>
                <h2>Col 3</h2>
            </div>
        </div>
    </div>
</body>

</html>
